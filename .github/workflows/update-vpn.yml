name: Update Krizzia VPN

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - build.py
      - .github/workflows/update-vpn.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lightweight profile
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python build.py

      - name: Save updated servers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          if git diff --cached --quiet; then
            echo "No server changes"
          else
            git commit -m "Update live-tested VPN servers"
            git push
          fi
